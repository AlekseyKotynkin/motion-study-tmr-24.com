<html lang = "en">

<head>
  <meta charset = "utf-8">
  <title>TMR Systems</title>
  <!-- Barcode генерация штрихкода -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <!-- Layout styles -->
  <!-- <link rel="stylesheet" href="assets/css/style.css"> -->
  <link href = "labels.css" rel = "stylesheet" type = "text/css">
  <style>
    body {
    margin: 0;
    padding: 0;
    border: 0;
    outline: 0;
    font-size: 100%;
    vertical-align: baseline;
    background: transparent;
    width: 1.500000cm;
    height: 1.500000cm;
    }
 
    .label{
    margin: 0;
    padding-top: 0.000000px;
    padding-right: 0px;
    padding-bottom: 0px;
    padding-left: 0.000000px;
    border: 0;
    outline: 0;
    font-size: 100%;
    vertical-align: baseline;
    background: transparent;
    width: 1.500000cm;
    height: 1.500000cm;

    font-family: Century Gothic;
    font-size: 9.000000px;
    font-weight: bold;
    float: left;
    text-align: Left;
    overflow: hidden;
    }

    .page-break  {
    clear: left;
    margin: 0;
    padding: 0;
    border: 0;
    outline: 0;
    display:block;
    page-break-after:always;
    }

    .pharmacyQRcode {
    margin-left: auto;
    margin-right: auto;
    display: inline-block;
    text-align:  center;
    width:40.000000px;
    height: 40.000000px;
    }

    .pharmacyInfoQRcode {
    margin-top: 5px;
    padding: 0;
    border: 0;
    outline: 0;
    display:block;
    text-align:  center;
    font-family: Century Gothic;
    font-size: 12.000000px;
    line-height: 5px;
    }

.bar-line {
  display: flex;
  padding: 1px;
}

.bar-line__left {
  flex: 1;
  width: 56.000000px;
  height: 56.000000px;
  text-align: center;
}
  </style>
  <script type="text/javascript">
    var url_string = document.URL;
    var url = new URL(url_string);
    var IP_camera = url.searchParams.get("IP_camera");

    var url_IPCamerar = new URL("https://api.qrserver.com/v1/create-qr-code/?data=2.101&size=40x40");
    url_IPCamerar.searchParams.set('data', IP_camera);
  </script>

</head>

<body onload = "printFunction();">
  <div class = "label">
    <div class="bar-line">
      <div class="bar-line__left">
        <!-- <img src="https://api.qrserver.com/v1/create-qr-code/?data=2.101&size=40x40" class="pharmacyQRcode" alt="image"> -->
        <img id="img_IPCamera" src="" class="pharmacyQRcode" alt="image">
        <script>
           document.getElementById("img_IPCamera").src=url_IPCamerar;
        </script>
        <p id = "text_IP_camera" class="pharmacyInfoQRcode lang" key="products_add_comments">2.000</p>
        <script>
          document.getElementById("text_IP_camera").innerText=IP_camera;
       </script>
      </div>
    </div>
  </div>
  <div class = "page-break"></div>
  <script>
    function printFunction() {
      var r = confirm("Do you want to open the print dialouge now?");
      if (r == true) {
        window.print();;
      } else {
        // closes alert
      }
    }
  </script>

</body>

</html>
